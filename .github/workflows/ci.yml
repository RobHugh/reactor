name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  format:
    name: format
    # Windows only: .editorconfig sets end_of_line = crlf and the repo stores LF, so only a Windows
    # checkout (core.autocrlf on) matches. On Linux every line would fail the whitespace check.
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ReactorSockets.slnx

      - name: Verify formatting
        run: dotnet format ReactorSockets.slnx --no-restore --verify-no-changes --verbosity normal

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The suite is a two-minute job. A run that passes this is hung, not slow, and a hang left to the
    # runner's own limit reports as "the hosted runner lost communication with the server" — with the
    # logs lost alongside it, because the runner dies before it uploads them.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore ReactorSockets.slnx

      - name: Build
        run: dotnet build ReactorSockets.slnx --no-restore --configuration Release

      # The IPv6 prefix tests (issue #453) need several local addresses in one /64, and loopback holds
      # only ::1. Without these, IPv6PrefixFactAttribute skips those tests rather than failing them.
      - name: Add IPv6 prefix test addresses (Linux)
        if: runner.os == 'Linux'
        run: |
          for address in fd00:453::1 fd00:453::2 fd00:453:0:1::1; do
            sudo ip -6 addr add "$address/128" dev lo
          done

      - name: Add IPv6 prefix test addresses (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($address in 'fd00:453::1', 'fd00:453::2', 'fd00:453:0:1::1') {
            New-NetIPAddress -InterfaceAlias 'Loopback Pseudo-Interface 1' -IPAddress $address -PrefixLength 128 | Out-Null
          }

      - name: Test
        run: >
          dotnet test ReactorSockets.slnx
          --no-build
          --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=${{ matrix.os }}.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
