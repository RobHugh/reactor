  <rect class="cls" x="70" y="90" width="255" height="190"/>
  <text class="st" x="197.5" y="107" text-anchor="middle">«class»</text>
  <text class="nm" x="197.5" y="125" text-anchor="middle">StreamSessionReactor</text>
  <line class="sep" x1="70" y1="131" x2="325" y2="131"/>
  <line class="sep" x1="70" y1="142" x2="325" y2="142"/>
  <text class="mem" x="82" y="160">+ Pump() : void</text>
  <text class="mem" x="82" y="175">+ Drain() : SessionEventReader</text>
  <text class="mem" x="82" y="190">+ Dial(remote : IPEndPoint) : Result&lt;PeerId&gt;</text>
  <text class="mem" x="82" y="205">+ Send(peer, data) : Result</text>
  <text class="mem" x="82" y="220">+ Close(peer) : Result   {sends Goodbye}</text>
  <text class="mem" x="82" y="235">+ LocalEndpoints : IReadOnlyList&lt;IPEndPoint&gt;</text>
  <text class="mem" x="82" y="250">+ Counters() : CounterSnapshot</text>
  <text class="mem" x="82" y="265">+ Dispose() : void</text>
  <rect class="cls" x="70" y="330" width="272" height="220"/>
  <text class="st" x="206" y="347" text-anchor="middle">«options»</text>
  <text class="nm" x="206" y="365" text-anchor="middle">StreamSessionOptions</text>
  <line class="sep" x1="70" y1="371" x2="342" y2="371"/>
  <text class="mem" x="82" y="389">+ Common : SharedOptions  {required}</text>
  <text class="mem" x="82" y="404">+ Endpoints : IReadOnlyList&lt;IPEndPoint&gt; = empty</text>
  <text class="mem" x="82" y="419">+ MaxMessageSize : int  {required}</text>
  <text class="mem" x="82" y="434">+ RetentionBytes : int  {required}</text>
  <text class="mem" x="82" y="449">+ SendIdleInterval : TimeSpan  {required}</text>
  <text class="mem" x="82" y="464">+ Linger : TimeSpan  {required}</text>
  <text class="mem" x="82" y="479">+ ReceiveBuffer : int = MaxMessageSize + 4</text>
  <text class="mem" x="82" y="494">+ MissedHeartbeats : int = 3  {RFC 4271}</text>
  <text class="der" x="82" y="509">+ /ReceiveIdleDeadline = peerSendIdle x count</text>
  <text class="der" x="82" y="524">+ /RedialSchedule = Pump interval .. Linger</text>
  <line class="sep" x1="70" y1="534" x2="342" y2="534"/>
  <rect class="cls" x="70" y="590" width="267" height="144"/>
  <text class="st" x="203.5" y="607" text-anchor="middle">«options»</text>
  <text class="nm" x="203.5" y="625" text-anchor="middle">SharedOptions</text>
  <text class="sb" x="203.5" y="638" text-anchor="middle">see the Raw diagram</text>
  <line class="sep" x1="70" y1="644" x2="337" y2="644"/>
  <text class="mem" x="82" y="662">+ Capacity : int  {required}</text>
  <text class="mem" x="82" y="677">+ AdmissionCap : int = Capacity</text>
  <text class="mem" x="82" y="692">+ ArenaBytes, TimeProvider, Sink, MinimumLevel</text>
  <text class="der" x="82" y="707">+ /ReadShare : int = ArenaBytes / Capacity</text>
  <line class="sep" x1="70" y1="717" x2="337" y2="717"/>
  <rect class="cls" x="530" y="90" width="249" height="144"/>
  <text class="st" x="654.5" y="107" text-anchor="middle">«ref struct»</text>
  <text class="nm" x="654.5" y="125" text-anchor="middle">SessionEvent</text>
  <text class="sb" x="654.5" y="138" text-anchor="middle">shared by both Session profiles</text>
  <line class="sep" x1="530" y1="144" x2="779" y2="144"/>
  <text class="mem" x="542" y="162">+ Kind : SessionEventKind</text>
  <text class="mem" x="542" y="177">+ Peer : PeerId</text>
  <text class="mem" x="542" y="192">+ Payload : ReadOnlySpan&lt;byte&gt;  {Message}</text>
  <text class="mem" x="542" y="207">+ Reason : DisconnectReason  {Closed}</text>
  <line class="sep" x1="530" y1="217" x2="779" y2="217"/>
  <rect class="cls" x="530" y="260" width="190" height="163"/>
  <text class="st" x="625" y="277" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="625" y="295" text-anchor="middle">SessionEventKind</text>
  <text class="sb" x="625" y="308" text-anchor="middle">roster not settled by any ADR</text>
  <line class="sep" x1="530" y1="314" x2="720" y2="314"/>
  <text class="mem" x="542" y="332">Connected</text>
  <text class="mem" x="542" y="347">MessageReceived</text>
  <text class="mem" x="542" y="362">Interrupted</text>
  <text class="mem" x="542" y="377">Resumed</text>
  <text class="mem" x="542" y="392">Closing</text>
  <text class="mem" x="542" y="407">Closed</text>
  <rect class="cls" x="530" y="460" width="190" height="115"/>
  <text class="st" x="625" y="477" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="625" y="495" text-anchor="middle">PeerId</text>
  <line class="sep" x1="530" y1="501" x2="720" y2="501"/>
  <text class="mem" x="542" y="519">- index : int</text>
  <text class="mem" x="542" y="534">- generation : int</text>
  <text class="mem" x="542" y="549">+ IsValid : bool</text>
  <line class="sep" x1="530" y1="559" x2="720" y2="559"/>
  <rect class="cls" x="530" y="605" width="190" height="115"/>
  <text class="st" x="625" y="622" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="625" y="640" text-anchor="middle">Result</text>
  <line class="sep" x1="530" y1="646" x2="720" y2="646"/>
  <text class="mem" x="542" y="664">+ IsOk : bool</text>
  <text class="mem" x="542" y="679">+ RetentionExhausted</text>
  <text class="mem" x="542" y="694">+ MessageTooLarge</text>
  <line class="sep" x1="530" y1="704" x2="720" y2="704"/>
  <rect class="cls" x="530" y="745" width="255" height="144"/>
  <text class="st" x="657.5" y="762" text-anchor="middle">«protocol»</text>
  <text class="nm" x="657.5" y="780" text-anchor="middle">Framing and liveness</text>
  <text class="sb" x="657.5" y="793" text-anchor="middle">not a public type</text>
  <line class="sep" x1="530" y1="799" x2="785" y2="799"/>
  <text class="mem" x="542" y="817">u32 length prefix per Message</text>
  <text class="mem" x="542" y="832">u64 cumulative received-Message counter</text>
  <text class="mem" x="542" y="847">framed capacity Refusal</text>
  <text class="mem" x="542" y="862">Goodbye, Closing, Interrupted, Linger, Resume</text>
  <line class="sep" x1="530" y1="872" x2="785" y2="872"/>
  <rect class="cls" x="950" y="223" width="190" height="133"/>
  <text class="st" x="1045" y="240" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="1045" y="258" text-anchor="middle">DisconnectReason</text>
  <text class="sb" x="1045" y="271" text-anchor="middle">roster not fully settled</text>
  <line class="sep" x1="950" y1="277" x2="1140" y2="277"/>
  <text class="mem" x="962" y="295">Goodbye</text>
  <text class="mem" x="962" y="310">CapacityRefused</text>
  <text class="mem" x="962" y="325">VersionRefused</text>
  <text class="mem" x="962" y="340">LingerExpired</text>
  <rect class="cls" x="950" y="405" width="228" height="100"/>
  <text class="st" x="1064" y="422" text-anchor="middle">«interface»</text>
  <text class="nm" x="1064" y="440" text-anchor="middle">IReactorDiagnostics</text>
  <line class="sep" x1="950" y1="446" x2="1178" y2="446"/>
  <line class="sep" x1="950" y1="457" x2="1178" y2="457"/>
  <text class="mem" x="962" y="475">+ IsEnabled(level) : bool</text>
  <text class="mem" x="962" y="490">+ Log(record : in DiagnosticRecord) : void</text>
  <rect class="cls" x="950" y="551" width="209" height="144"/>
  <text class="st" x="1054.5" y="568" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="1054.5" y="586" text-anchor="middle">DiagnosticRecord</text>
  <text class="sb" x="1054.5" y="599" text-anchor="middle">subject is a tagged value</text>
  <line class="sep" x1="950" y1="605" x2="1159" y2="605"/>
  <text class="mem" x="962" y="623">+ Id : DiagnosticId</text>
  <text class="mem" x="962" y="638">+ Level : DiagnosticLevel</text>
  <text class="mem" x="962" y="653">+ Subject : Peer | Link | Source | none</text>
  <text class="mem" x="962" y="668">+ Value0 / + Value1 : ulong</text>
  <line class="sep" x1="950" y1="678" x2="1159" y2="678"/>
  <rect class="cls" x="950" y="715" width="190" height="193"/>
  <text class="st" x="1045" y="732" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="1045" y="750" text-anchor="middle">DiagnosticId</text>
  <text class="sb" x="1045" y="763" text-anchor="middle">common and stream blocks</text>
  <line class="sep" x1="950" y1="769" x2="1140" y2="769"/>
  <text class="mem" x="962" y="787">AdmissionCapReached = 1</text>
  <text class="mem" x="962" y="802">ArenaExhausted = 2</text>
  <text class="mem" x="962" y="817">PeerRefused = 300</text>
  <text class="mem" x="962" y="832">LingerNegotiated = 301</text>
  <text class="mem" x="962" y="847">ResumeMatched = 302</text>
  <text class="mem" x="962" y="862">ResumeUnmatched = 303</text>
  <text class="mem" x="962" y="877">RedialAttempted = 304</text>
  <text class="mem" x="962" y="892">RedialFailed = 305</text>
  <path class="note" d="M70,760 h274 l12,12 v81 h-286 z"/>
  <path class="note" d="M344,760 v12 h12 z"/>
  <text class="ntxt" x="80" y="777">No delivery modes. TCP delivers every Message in</text>
  <text class="ntxt" x="80" y="792">order or the Session is interrupted — which is</text>
  <text class="ntxt" x="80" y="807">ReliableOrdered and nothing else. There is no</text>
  <text class="ntxt" x="80" y="822">cookie, no ack, no Space, no fragment and no RTO.</text>
  <text class="ntxt" x="80" y="837">(ADR 0010, delivery-modes.md)</text>
  <path class="note" d="M70,900 h271 l12,12 v66 h-283 z"/>
  <path class="note" d="M341,900 v12 h12 z"/>
  <text class="ntxt" x="80" y="917">Nagle is off, and that is part of the public</text>
  <text class="ntxt" x="80" y="932">contract rather than an implementation detail: we</text>
  <text class="ntxt" x="80" y="947">batch once per Pump, so a latency measurement is</text>
  <text class="ntxt" x="80" y="962">attributable to one of us.  (ADR 0011)</text>
  <path class="note" d="M530,900 h285 l12,12 v66 h-297 z"/>
  <path class="note" d="M815,900 v12 h12 z"/>
  <text class="ntxt" x="540" y="917">Resumption is by delivery counter, not byte offset.</text>
  <text class="ntxt" x="540" y="932">The counter increments when a Message is handed to</text>
  <text class="ntxt" x="540" y="947">the arena, not when bytes are read — backwards, it</text>
  <text class="ntxt" x="540" y="962">drops exactly what was in flight.  (ADR 0010)</text>
  <path class="note" d="M950,90 h233 l12,12 v81 h-245 z"/>
  <path class="note" d="M1183,90 v12 h12 z"/>
  <text class="ntxt" x="960" y="107">The library re-dials and the listener</text>
  <text class="ntxt" x="960" y="122">reserves the slot for Linger. The schedule</text>
  <text class="ntxt" x="960" y="137">doubles from the observed Pump interval to</text>
  <text class="ntxt" x="960" y="152">the effective Linger, with full jitter —</text>
  <text class="ntxt" x="960" y="167">derived, never configured.  (ADR 0011)</text>
  <path class="note" d="M950,925 h246 l12,12 v66 h-258 z"/>
  <path class="note" d="M1196,925 v12 h12 z"/>
  <text class="ntxt" x="960" y="942">Linger is announced in the handshake and the</text>
  <text class="ntxt" x="960" y="957">effective value is the minimum of the two, so</text>
  <text class="ntxt" x="960" y="972">both ends abandon the Session at the same</text>
  <text class="ntxt" x="960" y="987">instant.  (ADR 0011)</text>
</svg>
