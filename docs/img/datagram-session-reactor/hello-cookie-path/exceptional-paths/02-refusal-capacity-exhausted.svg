<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="872" viewBox="0 0 1700 872" font-family="Arial, Helvetica, sans-serif">
  <title>ReactorSockets :: Datagram Session :: Exceptional Path 2 of 3 :: Refusal — Capacity Exhausted</title>
  <defs>
    <marker id="arrow-edge" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#33383f"/>
    </marker>
    <marker id="arrow-edgeNo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b3402a"/>
    </marker>
    <marker id="arrow-edgeRp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-edgeCt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f8f56"/>
    </marker>
    <marker id="arrow-wire" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .page   { fill: #ffffff; }
    .frame  { fill: none; stroke: #9c9c9c; stroke-width: 1; }
    .tab    { fill: #f2f2f2; stroke: #9c9c9c; stroke-width: 1; }
    .ttl    { font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .subttl { font-size: 10.5px; fill: #5a6270; font-style: italic; }
    .lanehdr{ fill: #eef1f5; stroke: #9c9c9c; stroke-width: 1; }
    .lanettl{ font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .lanesub{ font-size: 10px; fill: #5a6270; }
    .start  { fill: #e6f4ea; stroke: #2f8f56; stroke-width: 1.3; }
    .startm { fill: #f4f7f5; stroke: #8fae9c; stroke-width: 1; stroke-dasharray: 4 3; }
    .proc   { fill: #eef2f7; stroke: #4d6a8a; stroke-width: 1.1; }
    .dec    { fill: #fff7e0; stroke: #b6902a; stroke-width: 1.1; }
    .endok  { fill: #dff5e4; stroke: #237a46; stroke-width: 1.6; }
    .endfin { fill: #cdeed8; stroke: #1c6b3c; stroke-width: 2.2; }
    .endexc { fill: #fdece6; stroke: #b3402a; stroke-width: 2.2; }
    .discard{ fill: #f2f2f2; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 2; }
    .except { fill: #fdece6; stroke: #b3402a; stroke-width: 1.2; }
    .replay { fill: #eaf1fb; stroke: #2b6cb0; stroke-width: 1.1; }
    .cont   { fill: #e6f4ea; stroke: #2f8f56; stroke-width: 1.1; stroke-dasharray: 3 2; }
    .nt     { font-size: 11.5px; font-weight: bold; fill: #14171c; }
    .nb     { font-size: 10px; fill: #33383f; }
    .nr     { font-size: 9px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .ex-t   { font-size: 10.5px; font-weight: bold; fill: #14171c; }
    .ex-b   { font-size: 9.3px; fill: #3f4650; }
    .ex-r   { font-size: 8.6px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .edge   { fill: none; stroke: #33383f; stroke-width: 1.4; }
    .edgeNo { fill: none; stroke: #b3402a; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edgeRp { fill: none; stroke: #2b6cb0; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edgeCt { fill: none; stroke: #2f8f56; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .wire   { fill: none; stroke: #2b6cb0; stroke-width: 2.6; }
    .lbl    { font-size: 10px; fill: #33383f; }
    .lblNo  { font-size: 9.3px; fill: #b3402a; }
    .lblRp  { font-size: 9.3px; fill: #2b6cb0; }
    .lblCt  { font-size: 9.3px; fill: #2f8f56; }
    .wlbl   { font-size: 11px; font-weight: bold; fill: #1c4a75; }
    .wlblbg { fill: #ffffff; opacity: 0.92; }
    .legend-r{ font-size: 9.5px; fill: #33383f; }

  </style>
  <rect class="page" x="0" y="0" width="1700" height="872"/>
  <rect class="frame" x="14" y="14" width="1672" height="844"/>
  <path class="tab" d="M14,14 h640 l-14,24 h-626 z"/>
  <text class="ttl" x="26" y="32">ReactorSockets :: Datagram Session :: Exceptional Path 2 of 3 :: Refusal — Capacity Exhausted</text>
  <text class="subttl" x="26" y="58">RefusalReason.cs: "Every capacity Slot was occupied. Says nothing about versions." Branches off critical-paths/03-hello-with-cookie.svg.</text>
  
    <rect class="lanehdr" x="330" y="78" width="380" height="44" rx="4"/>
    <text class="lanettl" x="520" y="97" text-anchor="middle">Dialler</text>
    <text class="lanesub" x="520" y="112" text-anchor="middle">the peer that called Connect()</text>
  
    <rect class="lanehdr" x="990" y="78" width="380" height="44" rx="4"/>
    <text class="lanettl" x="1180" y="97" text-anchor="middle">Acceptor</text>
    <text class="lanesub" x="1180" y="112" text-anchor="middle">the peer already listening</text>
  <rect class="startm" x="360" y="130" width="320" height="69" rx="34.5"/>
    <text class="nt" x="520" y="148" text-anchor="middle">ProcessDatagram →</text>
    <text class="nb" x="520" y="162" text-anchor="middle">DatagramControlType.Refusal</text>
    <text class="nr" x="520" y="176.5" text-anchor="middle">cs:442-443</text>
    <rect class="proc" x="360" y="219" width="320" height="56" rx="7"/>
    <text class="nt" x="520" y="237" text-anchor="middle">OnRefusal(source, datagram)</text>
    <text class="nr" x="520" y="253" text-anchor="middle">cs:651-672</text>
    <polygon class="dec" points="520,295 690,342.5 520,390 350,342.5"/>
    <text class="nt" x="520" y="327.5" text-anchor="middle">TryReadRefusal(datagram)</text>
    <text class="nb" x="520" y="342.5" text-anchor="middle">well-formed?</text>
    <text class="nr" x="520" y="357.5" text-anchor="middle">cs:653</text>
    <polygon class="dec" points="520,410 690,464 520,518 350,464"/>
    <text class="nt" x="520" y="441.5" text-anchor="middle">ResolveDial(...)</text>
    <text class="nb" x="520" y="456.5" text-anchor="middle">source, clientNonce, AwaitingAccept)</text>
    <text class="nb" x="520" y="471.5" text-anchor="middle">matches a live dial?</text>
    <text class="nr" x="520" y="486.5" text-anchor="middle">cs:659, 679-690</text>
    <polygon class="dec" points="520,538 690,585.5 520,633 350,585.5"/>
    <text class="nt" x="520" y="570.5" text-anchor="middle">DisconnectReasonFor(reason)</text>
    <text class="nb" x="520" y="585.5" text-anchor="middle">Capacity → recognized</text>
    <text class="nr" x="520" y="600.5" text-anchor="middle">cs:665, RefusalReason.cs:34-41</text>
    <rect class="proc" x="360" y="653" width="320" height="69" rx="7"/>
    <text class="nt" x="520" y="671" text-anchor="middle">ClosePeer(slot.Handle,</text>
    <text class="nb" x="520" y="685" text-anchor="middle">DisconnectReason.RemoteAtCapacity)</text>
    <text class="nr" x="520" y="699.5" text-anchor="middle">cs:671, 776-792</text>
    <rect class="endexc" x="360" y="742" width="320" height="70" rx="35"/>
    <text class="nt" x="520" y="760" text-anchor="middle">PeerClosed queued: RemoteAtCapacity</text>
    <text class="nb" x="520" y="774" text-anchor="middle">the remote had no room; the dialler’s own</text>
    <text class="nb" x="520" y="786.5" text-anchor="middle">Peer Slot is released regardless of its own capacity</text>
    <rect class="startm" x="1020" y="130" width="320" height="82" rx="41"/>
    <text class="nt" x="1180" y="148" text-anchor="middle">OnHelloWithCookie: _peers.TryAdd(...) fails</text>
    <text class="nb" x="1180" y="162" text-anchor="middle">the Acceptor’s own capacity Slot table is full</text>
    <text class="nb" x="1180" y="174.5" text-anchor="middle">continued from critical-paths/03-hello-with-cookie.svg</text>
    <text class="nr" x="1180" y="189" text-anchor="middle">cs:555-556</text>
    <rect class="proc" x="1020" y="232" width="320" height="69" rx="7"/>
    <text class="nt" x="1180" y="250" text-anchor="middle">RecordAdmissionDiscard();</text>
    <text class="nb" x="1180" y="264" text-anchor="middle">_capacityDiscardsThisFrame++</text>
    <text class="nr" x="1180" y="278.5" text-anchor="middle">cs:558-559</text>
    <rect class="proc" x="1020" y="321" width="320" height="69" rx="7"/>
    <text class="nt" x="1180" y="339" text-anchor="middle">WriteRefusal(...)</text>
    <text class="nb" x="1180" y="353" text-anchor="middle">clientNonce, RefusalReason.Capacity, 0, 0)</text>
    <text class="nr" x="1180" y="367.5" text-anchor="middle">cs:560</text>
    <rect class="proc" x="1020" y="410" width="320" height="56" rx="7"/>
    <text class="nt" x="1180" y="428" text-anchor="middle">SendControl(link, source)</text>
    <text class="nr" x="1180" y="444" text-anchor="middle">cs:561-562</text>
    <rect class="endok" x="1020" y="486" width="320" height="82" rx="41"/>
    <text class="nt" x="1180" y="504" text-anchor="middle">Refusal(Capacity) sent to wire</text>
    <text class="nb" x="1180" y="518" text-anchor="middle">reported once via ReportDeclinedAdmissions</text>
    <text class="nb" x="1180" y="530.5" text-anchor="middle">→ ForCapacityExhausted, not per-datagram</text>
    <text class="nr" x="1180" y="545" text-anchor="middle">cs:755-757</text>
    <rect class="discard" x="80" y="322.5" width="230" height="45" rx="6"/>
    <text class="ex-t" x="195" y="338.5" text-anchor="middle">DiscardMalformed</text>
    <text class="ex-r" x="195" y="352" text-anchor="middle">cs:655-656</text>
    <rect class="discard" x="80" y="444" width="230" height="69" rx="6"/>
    <text class="ex-t" x="195" y="460" text-anchor="middle">DiscardMalformed</text>
    <text class="ex-b" x="195" y="472.5" text-anchor="middle">guards against nonce-guessing tear-down</text>
    <text class="ex-b" x="195" y="484" text-anchor="middle">of another party’s handshake</text>
    <text class="ex-r" x="195" y="496.5" text-anchor="middle">cs:661-663</text>
    <rect class="discard" x="80" y="565.5" width="230" height="69" rx="6"/>
    <text class="ex-t" x="195" y="581.5" text-anchor="middle">DiscardMalformed</text>
    <text class="ex-b" x="195" y="594" text-anchor="middle">unrecognized reason byte —</text>
    <text class="ex-b" x="195" y="605.5" text-anchor="middle">indistinguishable from a forged Refusal</text>
    <text class="ex-r" x="195" y="618" text-anchor="middle">cs:667-668</text>
  
    <line class="edge" x1="520" y1="199" x2="520" y2="219" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="275" x2="520" y2="295" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="390" x2="520" y2="410" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="528" y="400">yes</text>
    <polyline class="edgeNo" points="350,342.5 310,345" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="330" y="336.5" text-anchor="middle">no</text>
    <line class="edge" x1="520" y1="518" x2="520" y2="538" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="528" y="528">yes</text>
    <polyline class="edgeNo" points="350,464 310,478.5" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="330" y="458" text-anchor="middle">no</text>
    <line class="edge" x1="520" y1="633" x2="520" y2="653" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="528" y="643">yes</text>
    <polyline class="edgeNo" points="350,585.5 310,600" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="330" y="579.5" text-anchor="middle">no</text>
    <line class="edge" x1="520" y1="722" x2="520" y2="742" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="212" x2="1180" y2="232" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="301" x2="1180" y2="321" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="390" x2="1180" y2="410" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="466" x2="1180" y2="486" marker-end="url(#arrow-edge)"/>
    <polyline class="wire" points="1020,527 850,527 850,164.5 680,164.5" marker-end="url(#arrow-wire)"/>
    <rect class="wlblbg" x="745" y="507" width="210" height="17" rx="3"/>
    <text class="wlbl" x="850" y="520" text-anchor="middle">UDP: Refusal(Capacity)</text>
  
    <g font-family="Arial, Helvetica, sans-serif">
      <rect class="proc" x="40" y="832" width="16" height="12" rx="2"/><text class="legend-r" x="60" y="842">step</text>
      <polygon class="dec" points="150,832 158,838 150,844 142,838"/><text class="legend-r" x="164" y="842">decision</text>
      <rect class="discard" x="240" y="832" width="16" height="12" rx="3"/><text class="legend-r" x="260" y="842">silent discard</text>
      <rect class="endexc" x="380" y="832" width="16" height="12" rx="6"/><text class="legend-r" x="400" y="842">exceptional exit (this path's end)</text>
      <rect class="endfin" x="640" y="832" width="16" height="12" rx="6"/><text class="legend-r" x="660" y="842">terminal event queued</text>
      <line class="wire" x1="880" y1="838" x2="910" y2="838" marker-end="url(#arrow-wire)"/><text class="legend-r" x="918" y="842">UDP wire</text>
      
    </g>
</svg>
