name: Probe (temporary)

on:
  push:
    branches: [agent/linux-support]
  workflow_dispatch:

# Throwaway. Reports how each runner's stack answers a dial to a set of candidate destinations, so a
# test can pick one on measurement rather than on what a developer's own machine happens to do. Delete
# once the addresses in RawReactorDialTests are settled.
jobs:
  probe:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Probe dial outcomes
        shell: bash
        run: |
          mkdir -p /tmp/probe && cd /tmp/probe
          cat > probe.csproj <<'CSPROJ'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <Nullable>disable</Nullable>
            </PropertyGroup>
          </Project>
          CSPROJ
          cat > Program.cs <<'PROGRAM'
          using System;
          using System.Net;
          using System.Net.Sockets;
          using System.Threading;

          Console.WriteLine(System.Runtime.InteropServices.RuntimeInformation.OSDescription);
          Console.WriteLine();

          Probe("240.0.0.1 reserved class E", "240.0.0.1", 1);
          Probe("224.0.0.1 link-local multicast", "224.0.0.1", 1);
          Probe("239.255.255.250 admin multicast", "239.255.255.250", 1);
          Probe("255.255.255.255 broadcast", "255.255.255.255", 1);
          Probe("100::1 discard prefix", "100::1", 1);
          Probe("2001:db8::1 documentation", "2001:db8::1", 1);
          Probe("ff02::1 v6 multicast", "ff02::1", 1);
          Probe("fe80::1 v6 link-local", "fe80::1", 1);
          Probe("::1 loopback port 0", "::1", 0);
          Probe("127.0.0.1 loopback port 0", "127.0.0.1", 0);

          static void Probe(string label, string address, int port)
          {
              IPEndPoint endpoint;
              Socket socket;
              try
              {
                  endpoint = new IPEndPoint(IPAddress.Parse(address), port);
                  socket = new Socket(endpoint.AddressFamily, SocketType.Stream, ProtocolType.Tcp);
              }
              catch (Exception exception)
              {
                  Console.WriteLine($"{label,-36} setup failed: {exception.GetType().Name}");
                  return;
              }

              using (socket)
              {
                  socket.Blocking = false;
                  SocketError sync = SocketError.Success;
                  try
                  {
                      socket.Connect(endpoint);
                  }
                  catch (SocketException exception)
                  {
                      sync = exception.SocketErrorCode;
                  }

                  SocketError pending = SocketError.Success;
                  if (sync == SocketError.Success || sync == SocketError.WouldBlock)
                  {
                      try
                      {
                          pending = (SocketError)(int)socket.GetSocketOption(
                              SocketOptionLevel.Socket, SocketOptionName.Error);
                      }
                      catch (SocketException)
                      {
                      }
                  }

                  SocketError resolved = sync != SocketError.WouldBlock && sync != SocketError.Success
                      ? sync
                      : pending;

                  string reason = resolved switch
                  {
                      SocketError.Success => "(still pending)",
                      SocketError.ConnectionRefused => "Refused",
                      SocketError.HostUnreachable or SocketError.NetworkUnreachable => "Unreachable",
                      _ => "Failed",
                  };

                  Console.WriteLine($"{label,-36} sync={sync,-22} pending={pending,-22} -> {reason}");
              }
          }
          PROGRAM
          dotnet run --project probe.csproj -v q --nologo
