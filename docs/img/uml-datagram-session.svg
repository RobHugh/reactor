  <rect class="cls" x="70" y="90" width="267" height="190"/>
  <text class="st" x="203.5" y="107" text-anchor="middle">«class»</text>
  <text class="nm" x="203.5" y="125" text-anchor="middle">DatagramSessionReactor</text>
  <line class="sep" x1="70" y1="131" x2="337" y2="131"/>
  <line class="sep" x1="70" y1="142" x2="337" y2="142"/>
  <text class="mem" x="82" y="160">+ Pump() : void</text>
  <text class="mem" x="82" y="175">+ Drain() : SessionEventReader</text>
  <text class="mem" x="82" y="190">+ Dial(remote : IPEndPoint) : Result&lt;PeerId&gt;</text>
  <text class="mem" x="82" y="205">+ Send(peer, mode : DeliveryMode, data) : Result</text>
  <text class="mem" x="82" y="220">+ Close(peer) : Result   {sends Goodbye}</text>
  <text class="mem" x="82" y="235">+ LocalEndpoints : IReadOnlyList&lt;IPEndPoint&gt;</text>
  <text class="mem" x="82" y="250">+ Counters() : CounterSnapshot</text>
  <text class="mem" x="82" y="265">+ Dispose() : void</text>
  <rect class="cls" x="70" y="330" width="272" height="235"/>
  <text class="st" x="206" y="347" text-anchor="middle">«options»</text>
  <text class="nm" x="206" y="365" text-anchor="middle">DatagramSessionOptions</text>
  <line class="sep" x1="70" y1="371" x2="342" y2="371"/>
  <text class="mem" x="82" y="389">+ Common : SharedOptions  {required}</text>
  <text class="mem" x="82" y="404">+ Endpoints : IReadOnlyList&lt;IPEndPoint&gt; = empty</text>
  <text class="mem" x="82" y="419">+ MaxMessageSize : int  {required}</text>
  <text class="mem" x="82" y="434">+ RetentionBytes : int  {required}</text>
  <text class="mem" x="82" y="449">+ SendIdleInterval : TimeSpan  {required}</text>
  <text class="mem" x="82" y="464">+ Linger : TimeSpan  {required}</text>
  <text class="mem" x="82" y="479">+ FragmentSize : int = 1200  {576 .. 65507}</text>
  <text class="mem" x="82" y="494">+ ReceiveWindow : int = its own floor</text>
  <text class="mem" x="82" y="509">+ MissedHeartbeats : int = 3  {RFC 4271}</text>
  <text class="der" x="82" y="524">+ /ReceiveIdleDeadline = peerSendIdle x count</text>
  <text class="der" x="82" y="539">+ /Rto = adaptive, Pump interval .. Linger</text>
  <line class="sep" x1="70" y1="549" x2="342" y2="549"/>
  <rect class="cls" x="70" y="610" width="267" height="144"/>
  <text class="st" x="203.5" y="627" text-anchor="middle">«options»</text>
  <text class="nm" x="203.5" y="645" text-anchor="middle">SharedOptions</text>
  <text class="sb" x="203.5" y="658" text-anchor="middle">see the Raw diagram</text>
  <line class="sep" x1="70" y1="664" x2="337" y2="664"/>
  <text class="mem" x="82" y="682">+ Capacity : int  {required}</text>
  <text class="mem" x="82" y="697">+ AdmissionCap : int = Capacity</text>
  <text class="mem" x="82" y="712">+ ArenaBytes, TimeProvider, Sink, MinimumLevel</text>
  <text class="der" x="82" y="727">+ /ReadShare : int = ArenaBytes / Capacity</text>
  <line class="sep" x1="70" y1="737" x2="337" y2="737"/>
  <rect class="cls" x="530" y="90" width="249" height="144"/>
  <text class="st" x="654.5" y="107" text-anchor="middle">«ref struct»</text>
  <text class="nm" x="654.5" y="125" text-anchor="middle">SessionEvent</text>
  <text class="sb" x="654.5" y="138" text-anchor="middle">shared by both Session profiles</text>
  <line class="sep" x1="530" y1="144" x2="779" y2="144"/>
  <text class="mem" x="542" y="162">+ Kind : SessionEventKind</text>
  <text class="mem" x="542" y="177">+ Peer : PeerId</text>
  <text class="mem" x="542" y="192">+ Payload : ReadOnlySpan&lt;byte&gt;  {Message}</text>
  <text class="mem" x="542" y="207">+ Reason : DisconnectReason  {Closed}</text>
  <line class="sep" x1="530" y1="217" x2="779" y2="217"/>
  <rect class="cls" x="530" y="260" width="190" height="163"/>
  <text class="st" x="625" y="277" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="625" y="295" text-anchor="middle">SessionEventKind</text>
  <text class="sb" x="625" y="308" text-anchor="middle">roster not settled by any ADR</text>
  <line class="sep" x1="530" y1="314" x2="720" y2="314"/>
  <text class="mem" x="542" y="332">Connected</text>
  <text class="mem" x="542" y="347">MessageReceived</text>
  <text class="mem" x="542" y="362">Interrupted</text>
  <text class="mem" x="542" y="377">Resumed</text>
  <text class="mem" x="542" y="392">Closing</text>
  <text class="mem" x="542" y="407">Closed</text>
  <rect class="cls" x="530" y="460" width="190" height="115"/>
  <text class="st" x="625" y="477" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="625" y="495" text-anchor="middle">PeerId</text>
  <line class="sep" x1="530" y1="501" x2="720" y2="501"/>
  <text class="mem" x="542" y="519">- index : int</text>
  <text class="mem" x="542" y="534">- generation : int</text>
  <text class="mem" x="542" y="549">+ IsValid : bool</text>
  <line class="sep" x1="530" y1="559" x2="720" y2="559"/>
  <rect class="cls" x="530" y="605" width="190" height="133"/>
  <text class="st" x="625" y="622" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="625" y="640" text-anchor="middle">DeliveryMode</text>
  <text class="sb" x="625" y="653" text-anchor="middle">one Space each</text>
  <line class="sep" x1="530" y1="659" x2="720" y2="659"/>
  <text class="mem" x="542" y="677">ReliableOrdered</text>
  <text class="mem" x="542" y="692">ReliableUnordered</text>
  <text class="mem" x="542" y="707">UnreliableSequenced</text>
  <text class="mem" x="542" y="722">Unreliable</text>
  <rect class="cls" x="530" y="765" width="190" height="115"/>
  <text class="st" x="625" y="782" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="625" y="800" text-anchor="middle">Result</text>
  <line class="sep" x1="530" y1="806" x2="720" y2="806"/>
  <text class="mem" x="542" y="824">+ IsOk : bool</text>
  <text class="mem" x="542" y="839">+ RetentionExhausted</text>
  <text class="mem" x="542" y="854">+ MessageTooLarge</text>
  <line class="sep" x1="530" y1="864" x2="720" y2="864"/>
  <rect class="cls" x="950" y="223" width="190" height="133"/>
  <text class="st" x="1045" y="240" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="1045" y="258" text-anchor="middle">DisconnectReason</text>
  <text class="sb" x="1045" y="271" text-anchor="middle">roster not fully settled</text>
  <line class="sep" x1="950" y1="277" x2="1140" y2="277"/>
  <text class="mem" x="962" y="295">Goodbye</text>
  <text class="mem" x="962" y="310">CapacityRefused</text>
  <text class="mem" x="962" y="325">VersionRefused</text>
  <text class="mem" x="962" y="340">LingerExpired</text>
  <rect class="cls" x="950" y="405" width="228" height="100"/>
  <text class="st" x="1064" y="422" text-anchor="middle">«interface»</text>
  <text class="nm" x="1064" y="440" text-anchor="middle">IReactorDiagnostics</text>
  <line class="sep" x1="950" y1="446" x2="1178" y2="446"/>
  <line class="sep" x1="950" y1="457" x2="1178" y2="457"/>
  <text class="mem" x="962" y="475">+ IsEnabled(level) : bool</text>
  <text class="mem" x="962" y="490">+ Log(record : in DiagnosticRecord) : void</text>
  <rect class="cls" x="950" y="551" width="209" height="144"/>
  <text class="st" x="1054.5" y="568" text-anchor="middle">«readonly struct»</text>
  <text class="nm" x="1054.5" y="586" text-anchor="middle">DiagnosticRecord</text>
  <text class="sb" x="1054.5" y="599" text-anchor="middle">subject is a tagged value</text>
  <line class="sep" x1="950" y1="605" x2="1159" y2="605"/>
  <text class="mem" x="962" y="623">+ Id : DiagnosticId</text>
  <text class="mem" x="962" y="638">+ Level : DiagnosticLevel</text>
  <text class="mem" x="962" y="653">+ Subject : Peer | Link | Source | none</text>
  <text class="mem" x="962" y="668">+ Value0 / + Value1 : ulong</text>
  <line class="sep" x1="950" y1="678" x2="1159" y2="678"/>
  <rect class="cls" x="950" y="715" width="211" height="178"/>
  <text class="st" x="1055.5" y="732" text-anchor="middle">«enumeration»</text>
  <text class="nm" x="1055.5" y="750" text-anchor="middle">DiagnosticId</text>
  <text class="sb" x="1055.5" y="763" text-anchor="middle">common and datagram blocks</text>
  <line class="sep" x1="950" y1="769" x2="1161" y2="769"/>
  <text class="mem" x="962" y="787">AdmissionCapReached = 1</text>
  <text class="mem" x="962" y="802">ArenaExhausted = 2</text>
  <text class="mem" x="962" y="817">DatagramMalformed = 200</text>
  <text class="mem" x="962" y="832">CookieRejected = 201</text>
  <text class="mem" x="962" y="847">VersionRefused = 202</text>
  <text class="mem" x="962" y="862">FragmentSetAbandoned = 203</text>
  <text class="mem" x="962" y="877">RetransmissionTimerBackedOff = 204</text>
  <path class="note" d="M70,780 h279 l12,12 v81 h-291 z"/>
  <path class="note" d="M349,780 v12 h12 z"/>
  <text class="ntxt" x="80" y="797">Endpoints are fixed at construction and never</text>
  <text class="ntxt" x="80" y="812">rebound — rebinding is a new Reactor. An empty set</text>
  <text class="ntxt" x="80" y="827">is legal and means dial-only: the first Dial binds</text>
  <text class="ntxt" x="80" y="842">a wildcard port-0 socket in the destination's own</text>
  <text class="ntxt" x="80" y="857">address family.  (ADR 0014)</text>
  <path class="note" d="M70,910 h279 l12,12 v66 h-291 z"/>
  <path class="note" d="M349,910 v12 h12 z"/>
  <text class="ntxt" x="80" y="927">One bound socket carries every Peer; the session id</text>
  <text class="ntxt" x="80" y="942">demultiplexes. Capacity counts Peers, and the</text>
  <text class="ntxt" x="80" y="957">per-Pump read share belongs to the Peer rather than</text>
  <text class="ntxt" x="80" y="972">to the socket.  (ADR 0014 correcting ADR 0012)</text>
  <path class="note" d="M530,900 h273 l12,12 v66 h-285 z"/>
  <path class="note" d="M803,900 v12 h12 z"/>
  <text class="ntxt" x="540" y="917">Send is the only place backpressure appears, and it</text>
  <text class="ntxt" x="540" y="932">appears as a failed Result — never blocking, never</text>
  <text class="ntxt" x="540" y="947">dropping, never growing. Only the reliable modes</text>
  <text class="ntxt" x="540" y="962">fragment.  (ADR 0010, delivery-modes.md)</text>
  <path class="note" d="M950,90 h239 l12,12 v81 h-251 z"/>
  <path class="note" d="M1189,90 v12 h12 z"/>
  <text class="ntxt" x="960" y="107">No ADR enumerates the Session event</text>
  <text class="ntxt" x="960" y="122">roster. ADR 0010 settles only that</text>
  <text class="ntxt" x="960" y="137">SessionEvent and PeerId are shared by both</text>
  <text class="ntxt" x="960" y="152">Session profiles; the kinds shown are the</text>
  <text class="ntxt" x="960" y="167">ones the ADRs and CONTEXT.md name.</text>
  <path class="note" d="M950,925 h252 l12,12 v66 h-264 z"/>
  <path class="note" d="M1202,925 v12 h12 z"/>
  <text class="ntxt" x="960" y="942">A malformed datagram, a rejected cookie and a</text>
  <text class="ntxt" x="960" y="957">refused version name a Source, not a Peer:</text>
  <text class="ntxt" x="960" y="972">nothing is allocated until a validated Hello</text>
  <text class="ntxt" x="960" y="987">with a cookie arrives.  (ADR 0013)</text>
</svg>
