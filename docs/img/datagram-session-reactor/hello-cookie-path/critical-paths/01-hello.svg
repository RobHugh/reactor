<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="859" viewBox="0 0 1700 859" font-family="Arial, Helvetica, sans-serif">
  <title>ReactorSockets :: Datagram Session :: Critical Path 1 of 4 :: Hello</title>
  <defs>
    <marker id="arrow-edge" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#33383f"/>
    </marker>
    <marker id="arrow-edgeNo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b3402a"/>
    </marker>
    <marker id="arrow-edgeRp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-wire" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .page   { fill: #ffffff; }
    .frame  { fill: none; stroke: #9c9c9c; stroke-width: 1; }
    .tab    { fill: #f2f2f2; stroke: #9c9c9c; stroke-width: 1; }
    .ttl    { font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .subttl { font-size: 10.5px; fill: #5a6270; font-style: italic; }
    .lanehdr{ fill: #eef1f5; stroke: #9c9c9c; stroke-width: 1; }
    .lanettl{ font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .lanesub{ font-size: 10px; fill: #5a6270; }
    .start  { fill: #e6f4ea; stroke: #2f8f56; stroke-width: 1.3; }
    .startm { fill: #f4f7f5; stroke: #8fae9c; stroke-width: 1; stroke-dasharray: 4 3; }
    .proc   { fill: #eef2f7; stroke: #4d6a8a; stroke-width: 1.1; }
    .dec    { fill: #fff7e0; stroke: #b6902a; stroke-width: 1.1; }
    .endok  { fill: #dff5e4; stroke: #237a46; stroke-width: 1.6; }
    .endfin { fill: #cdeed8; stroke: #1c6b3c; stroke-width: 2.2; }
    .discard{ fill: #f2f2f2; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 2; }
    .except { fill: #fdece6; stroke: #b3402a; stroke-width: 1.2; }
    .replay { fill: #eaf1fb; stroke: #2b6cb0; stroke-width: 1.1; }
    .nt     { font-size: 11.5px; font-weight: bold; fill: #14171c; }
    .nb     { font-size: 10px; fill: #33383f; }
    .nr     { font-size: 9px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .ex-t   { font-size: 10.5px; font-weight: bold; fill: #14171c; }
    .ex-b   { font-size: 9.3px; fill: #3f4650; }
    .ex-r   { font-size: 8.6px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .edge   { fill: none; stroke: #33383f; stroke-width: 1.4; }
    .edgeNo { fill: none; stroke: #b3402a; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edgeRp { fill: none; stroke: #2b6cb0; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .wire   { fill: none; stroke: #2b6cb0; stroke-width: 2.6; }
    .lbl    { font-size: 10px; fill: #33383f; }
    .lblNo  { font-size: 9.3px; fill: #b3402a; }
    .lblRp  { font-size: 9.3px; fill: #2b6cb0; }
    .wlbl   { font-size: 11px; font-weight: bold; fill: #1c4a75; }
    .wlblbg { fill: #ffffff; opacity: 0.92; }
    .legend-r{ font-size: 9.5px; fill: #33383f; }

  </style>
  <rect class="page" x="0" y="0" width="1700" height="859"/>
  <rect class="frame" x="14" y="14" width="1672" height="831"/>
  <path class="tab" d="M14,14 h640 l-14,24 h-626 z"/>
  <text class="ttl" x="26" y="32">ReactorSockets :: Datagram Session :: Critical Path 1 of 4 :: Hello</text>
  <text class="subttl" x="26" y="58">The dialler’s opening bid. ADR 0009: "a bare Hello is answered with a Cookie whatever it claimed — never a Refusal."</text>
  
    <rect class="lanehdr" x="330" y="78" width="380" height="44" rx="4"/>
    <text class="lanettl" x="520" y="97" text-anchor="middle">Dialler</text>
    <text class="lanesub" x="520" y="112" text-anchor="middle">the peer calling Connect()</text>
  
    <rect class="lanehdr" x="990" y="78" width="380" height="44" rx="4"/>
    <text class="lanettl" x="1180" y="97" text-anchor="middle">Acceptor</text>
    <text class="lanesub" x="1180" y="112" text-anchor="middle">the peer already listening</text>
  <rect class="start" x="360" y="130" width="320" height="56" rx="28"/>
    <text class="nt" x="520" y="148" text-anchor="middle">Connect(destination)</text>
    <text class="nr" x="520" y="164" text-anchor="middle">DatagramSessionReactor.cs:222-251</text>
    <rect class="proc" x="360" y="206" width="320" height="82" rx="7"/>
    <text class="nt" x="520" y="224" text-anchor="middle">Guards</text>
    <text class="nb" x="520" y="238" text-anchor="middle">EnsureUsable() /</text>
    <text class="nb" x="520" y="250.5" text-anchor="middle">EnsureCallingThreadIsConstructingThread()</text>
    <text class="nr" x="520" y="265" text-anchor="middle">cs:222-225</text>
    <rect class="proc" x="360" y="308" width="320" height="82" rx="7"/>
    <text class="nt" x="520" y="326" text-anchor="middle">LinkForFamily(destination.AddressFamily)</text>
    <text class="nb" x="520" y="340" text-anchor="middle">reuse bound UdpLink, or lazily bind a</text>
    <text class="nb" x="520" y="352.5" text-anchor="middle">wildcard port-zero socket</text>
    <text class="nr" x="520" y="367" text-anchor="middle">cs:228, 333-345</text>
    <rect class="proc" x="360" y="410" width="320" height="95" rx="7"/>
    <text class="nt" x="520" y="428" text-anchor="middle">Build PeerSlot</text>
    <text class="nb" x="520" y="442" text-anchor="middle">State = AwaitingCookie</text>
    <text class="nb" x="520" y="454.5" text-anchor="middle">ClientNonce, LocalSessionId,</text>
    <text class="nb" x="520" y="467" text-anchor="middle">LocalResumeSecret freshly generated</text>
    <text class="nr" x="520" y="481.5" text-anchor="middle">cs:231-239, 802-833</text>
    <polygon class="dec" points="520,525 690,572.5 520,620 350,572.5"/>
    <text class="nt" x="520" y="557.5" text-anchor="middle">_peers.TryAdd(slot)</text>
    <text class="nb" x="520" y="572.5" text-anchor="middle">capacity available?</text>
    <text class="nr" x="520" y="587.5" text-anchor="middle">cs:241</text>
    <rect class="proc" x="360" y="640" width="320" height="56" rx="7"/>
    <text class="nt" x="520" y="658" text-anchor="middle">_dialsByNonce[ClientNonce] = handle</text>
    <text class="nr" x="520" y="674" text-anchor="middle">cs:245</text>
    <rect class="proc" x="360" y="716" width="320" height="82" rx="7"/>
    <text class="nt" x="520" y="734" text-anchor="middle">WriteHello + SendControl</text>
    <text class="nb" x="520" y="748" text-anchor="middle">returns PeerId immediately;</text>
    <text class="nb" x="520" y="760.5" text-anchor="middle">resolution happens on a later Pump()</text>
    <text class="nr" x="520" y="775" text-anchor="middle">cs:247-248</text>
    <rect class="startm" x="1020" y="130" width="320" height="56" rx="28"/>
    <text class="nt" x="1180" y="148" text-anchor="middle">ProcessDatagram → DatagramControlType.Hello</text>
    <text class="nr" x="1180" y="164" text-anchor="middle">cs:426-427</text>
    <rect class="proc" x="1020" y="206" width="320" height="56" rx="7"/>
    <text class="nt" x="1180" y="224" text-anchor="middle">OnHello(link, source, datagram)</text>
    <text class="nr" x="1180" y="240" text-anchor="middle">cs:481-499</text>
    <polygon class="dec" points="1180,282 1350,329.5 1180,377 1010,329.5"/>
    <text class="nt" x="1180" y="314.5" text-anchor="middle">TryChargeAdmission()</text>
    <text class="nb" x="1180" y="329.5" text-anchor="middle">per-Pump admission budget available?</text>
    <text class="nr" x="1180" y="344.5" text-anchor="middle">cs:483</text>
    <polygon class="dec" points="1180,397 1350,444.5 1180,492 1010,444.5"/>
    <text class="nt" x="1180" y="429.5" text-anchor="middle">TryReadHello(datagram)</text>
    <text class="nb" x="1180" y="444.5" text-anchor="middle">well-formed?</text>
    <text class="nr" x="1180" y="459.5" text-anchor="middle">cs:488</text>
    <rect class="proc" x="1020" y="512" width="320" height="95" rx="7"/>
    <text class="nt" x="1180" y="530" text-anchor="middle">_cookies.Mint(...)</text>
    <text class="nb" x="1180" y="544" text-anchor="middle">source, clientNonce, cookie, out epoch</text>
    <text class="nb" x="1180" y="556.5" text-anchor="middle">stateless HMAC — nothing allocated</text>
    <text class="nb" x="1180" y="569" text-anchor="middle">for the sender</text>
    <text class="nr" x="1180" y="583.5" text-anchor="middle">cs:495</text>
    <rect class="proc" x="1020" y="627" width="320" height="82" rx="7"/>
    <text class="nt" x="1180" y="645" text-anchor="middle">WriteCookie + SendControl</text>
    <text class="nb" x="1180" y="659" text-anchor="middle">reply is exactly ControlDatagramSize bytes</text>
    <text class="nb" x="1180" y="671.5" text-anchor="middle">(amplification bound)</text>
    <text class="nr" x="1180" y="686" text-anchor="middle">cs:497-498</text>
    <rect class="endok" x="1020" y="729" width="320" height="70" rx="35"/>
    <text class="nt" x="1180" y="747" text-anchor="middle">Cookie sent to wire</text>
    <text class="nb" x="1180" y="761" text-anchor="middle">pure wire traffic — no SessionEventKind queued</text>
    <text class="nb" x="1180" y="773.5" text-anchor="middle">continues in critical path 2: Cookie</text>
    <rect class="except" x="60" y="552.5" width="250" height="69" rx="6"/>
    <text class="ex-t" x="185" y="568.5" text-anchor="middle">throw InvalidOperationException</text>
    <text class="ex-b" x="185" y="581" text-anchor="middle">synchronous — the one handshake failure</text>
    <text class="ex-b" x="185" y="592.5" text-anchor="middle">that is not an event (no Peer/Slot yet)</text>
    <text class="ex-r" x="185" y="605" text-anchor="middle">cs:241-242</text>
    <rect class="discard" x="1390" y="309.5" width="230" height="69" rx="6"/>
    <text class="ex-t" x="1505" y="325.5" text-anchor="middle">Silent discard</text>
    <text class="ex-b" x="1505" y="338" text-anchor="middle">RecordAdmissionDiscard;</text>
    <text class="ex-b" x="1505" y="349.5" text-anchor="middle">reported once via ReportDeclinedAdmissions</text>
    <text class="ex-r" x="1505" y="362" text-anchor="middle">cs:730-741, 748-759</text>
    <rect class="discard" x="1390" y="424.5" width="230" height="45" rx="6"/>
    <text class="ex-t" x="1505" y="440.5" text-anchor="middle">DiscardMalformed(source, len)</text>
    <text class="ex-r" x="1505" y="454" text-anchor="middle">cs:490-491, 761-765</text>
  
    <line class="edge" x1="520" y1="186" x2="520" y2="206" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="288" x2="520" y2="308" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="390" x2="520" y2="410" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="505" x2="520" y2="525" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="520" y1="620" x2="520" y2="640" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="528" y="630">yes</text>
    <polyline class="edgeNo" points="350,572.5 310,587" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="330" y="566.5" text-anchor="middle">no (capacity full)</text>
    <line class="edge" x1="520" y1="696" x2="520" y2="716" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="186" x2="1180" y2="206" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="262" x2="1180" y2="282" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="377" x2="1180" y2="397" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="1188" y="387">yes</text>
    <polyline class="edgeNo" points="1350,329.5 1390,344" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="1370" y="323.5" text-anchor="middle">no (cap exhausted)</text>
    <line class="edge" x1="1180" y1="492" x2="1180" y2="512" marker-end="url(#arrow-edge)"/>
    <text class="lbl" x="1188" y="502">yes</text>
    <polyline class="edgeNo" points="1350,444.5 1390,447" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="1370" y="438.5" text-anchor="middle">no</text>
    <line class="edge" x1="1180" y1="607" x2="1180" y2="627" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="1180" y1="709" x2="1180" y2="729" marker-end="url(#arrow-edge)"/>
    <polyline class="wire" points="680,757 850,757 850,158 1020,158" marker-end="url(#arrow-wire)"/>
    <rect class="wlblbg" x="745" y="737" width="210" height="17" rx="3"/>
    <text class="wlbl" x="850" y="750" text-anchor="middle">UDP: Hello datagram</text>
  
    <g font-family="Arial, Helvetica, sans-serif">
      <rect class="proc" x="40" y="819" width="16" height="12" rx="2"/><text class="legend-r" x="60" y="829">step</text>
      <polygon class="dec" points="150,819 158,825 150,831 142,825"/><text class="legend-r" x="164" y="829">decision</text>
      <rect class="endok" x="240" y="819" width="16" height="12" rx="6"/><text class="legend-r" x="260" y="829">success exit</text>
      <rect class="discard" x="360" y="819" width="16" height="12" rx="3"/><text class="legend-r" x="380" y="829">silent discard</text>
      <rect class="except" x="480" y="819" width="16" height="12" rx="3"/><text class="legend-r" x="500" y="829">exceptional path (see sibling folder)</text>
      <rect class="replay" x="730" y="819" width="16" height="12" rx="3"/><text class="legend-r" x="750" y="829">idempotent replay</text>
      <line class="wire" x1="880" y1="825" x2="910" y2="825" marker-end="url(#arrow-wire)"/><text class="legend-r" x="918" y="829">UDP wire</text>
    </g>
</svg>
