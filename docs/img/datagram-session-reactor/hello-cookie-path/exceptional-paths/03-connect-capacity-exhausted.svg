<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="706" viewBox="0 0 1700 706" font-family="Arial, Helvetica, sans-serif">
  <title>ReactorSockets :: Datagram Session :: Exceptional Path 3 of 3 :: Connect() Capacity Exhausted</title>
  <defs>
    <marker id="arrow-edge" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#33383f"/>
    </marker>
    <marker id="arrow-edgeNo" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#b3402a"/>
    </marker>
    <marker id="arrow-edgeRp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
    <marker id="arrow-edgeCt" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2f8f56"/>
    </marker>
    <marker id="arrow-wire" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b6cb0"/>
    </marker>
  </defs>
  <style>
    .page   { fill: #ffffff; }
    .frame  { fill: none; stroke: #9c9c9c; stroke-width: 1; }
    .tab    { fill: #f2f2f2; stroke: #9c9c9c; stroke-width: 1; }
    .ttl    { font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .subttl { font-size: 10.5px; fill: #5a6270; font-style: italic; }
    .lanehdr{ fill: #eef1f5; stroke: #9c9c9c; stroke-width: 1; }
    .lanettl{ font-size: 13px; font-weight: bold; fill: #2b2f36; }
    .lanesub{ font-size: 10px; fill: #5a6270; }
    .start  { fill: #e6f4ea; stroke: #2f8f56; stroke-width: 1.3; }
    .startm { fill: #f4f7f5; stroke: #8fae9c; stroke-width: 1; stroke-dasharray: 4 3; }
    .proc   { fill: #eef2f7; stroke: #4d6a8a; stroke-width: 1.1; }
    .dec    { fill: #fff7e0; stroke: #b6902a; stroke-width: 1.1; }
    .endok  { fill: #dff5e4; stroke: #237a46; stroke-width: 1.6; }
    .endfin { fill: #cdeed8; stroke: #1c6b3c; stroke-width: 2.2; }
    .endexc { fill: #fdece6; stroke: #b3402a; stroke-width: 2.2; }
    .discard{ fill: #f2f2f2; stroke: #8a8a8a; stroke-width: 1; stroke-dasharray: 3 2; }
    .except { fill: #fdece6; stroke: #b3402a; stroke-width: 1.2; }
    .replay { fill: #eaf1fb; stroke: #2b6cb0; stroke-width: 1.1; }
    .cont   { fill: #e6f4ea; stroke: #2f8f56; stroke-width: 1.1; stroke-dasharray: 3 2; }
    .nt     { font-size: 11.5px; font-weight: bold; fill: #14171c; }
    .nb     { font-size: 10px; fill: #33383f; }
    .nr     { font-size: 9px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .ex-t   { font-size: 10.5px; font-weight: bold; fill: #14171c; }
    .ex-b   { font-size: 9.3px; fill: #3f4650; }
    .ex-r   { font-size: 8.6px; font-family: Consolas, 'Courier New', monospace; fill: #6b7280; }
    .edge   { fill: none; stroke: #33383f; stroke-width: 1.4; }
    .edgeNo { fill: none; stroke: #b3402a; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edgeRp { fill: none; stroke: #2b6cb0; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .edgeCt { fill: none; stroke: #2f8f56; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .wire   { fill: none; stroke: #2b6cb0; stroke-width: 2.6; }
    .lbl    { font-size: 10px; fill: #33383f; }
    .lblNo  { font-size: 9.3px; fill: #b3402a; }
    .lblRp  { font-size: 9.3px; fill: #2b6cb0; }
    .lblCt  { font-size: 9.3px; fill: #2f8f56; }
    .wlbl   { font-size: 11px; font-weight: bold; fill: #1c4a75; }
    .wlblbg { fill: #ffffff; opacity: 0.92; }
    .legend-r{ font-size: 9.5px; fill: #33383f; }

  </style>
  <rect class="page" x="0" y="0" width="1700" height="706"/>
  <rect class="frame" x="14" y="14" width="1672" height="678"/>
  <path class="tab" d="M14,14 h640 l-14,24 h-626 z"/>
  <text class="ttl" x="26" y="32">ReactorSockets :: Datagram Session :: Exceptional Path 3 of 3 :: Connect() Capacity Exhausted</text>
  <text class="subttl" x="26" y="58">Doc comment on Connect(): the handshake is work this Reactor is holding — dialling past capacity is discovered here, not on the far side of a round trip.</text>
  
    <rect class="lanehdr" x="660" y="78" width="380" height="44" rx="4"/>
    <text class="lanettl" x="850" y="97" text-anchor="middle">Dialler</text>
    <text class="lanesub" x="850" y="112" text-anchor="middle">the peer calling Connect() — this path never reaches the wire</text>
  <rect class="start" x="690" y="130" width="320" height="56" rx="28"/>
    <text class="nt" x="850" y="148" text-anchor="middle">Connect(destination) called</text>
    <text class="nr" x="850" y="164" text-anchor="middle">cs:222</text>
    <rect class="proc" x="690" y="206" width="320" height="95" rx="7"/>
    <text class="nt" x="850" y="224" text-anchor="middle">Guards</text>
    <text class="nb" x="850" y="238" text-anchor="middle">EnsureUsable() /</text>
    <text class="nb" x="850" y="250.5" text-anchor="middle">EnsureCallingThreadIsConstructingThread() /</text>
    <text class="nb" x="850" y="263" text-anchor="middle">ArgumentNullException.ThrowIfNull(destination)</text>
    <text class="nr" x="850" y="277.5" text-anchor="middle">cs:224-226</text>
    <rect class="proc" x="690" y="321" width="320" height="82" rx="7"/>
    <text class="nt" x="850" y="339" text-anchor="middle">LinkForFamily + build PeerSlot</text>
    <text class="nb" x="850" y="353" text-anchor="middle">State = AwaitingCookie; nonce/session-id/secret</text>
    <text class="nb" x="850" y="365.5" text-anchor="middle">generated up front, before capacity is even checked</text>
    <text class="nr" x="850" y="380" text-anchor="middle">cs:228-239</text>
    <polygon class="dec" points="850,423 1020,470.5 850,518 680,470.5"/>
    <text class="nt" x="850" y="455.5" text-anchor="middle">_peers.TryAdd(slot)</text>
    <text class="nb" x="850" y="470.5" text-anchor="middle">capacity available?</text>
    <text class="nr" x="850" y="485.5" text-anchor="middle">cs:241</text>
    <rect class="endexc" x="690" y="538" width="320" height="108" rx="54"/>
    <text class="nt" x="850" y="556" text-anchor="middle">throw InvalidOperationException</text>
    <text class="nb" x="850" y="570" text-anchor="middle">"This Reactor’s capacity of {Capacity} Peers is fully</text>
    <text class="nb" x="850" y="582.5" text-anchor="middle">occupied — close a Peer before dialling another."</text>
    <text class="nb" x="850" y="595" text-anchor="middle">thrown on the caller’s own thread — no PeerSlot was</text>
    <text class="nb" x="850" y="607.5" text-anchor="middle">ever admitted, so there is no PeerClosed to drain</text>
    <text class="nr" x="850" y="622" text-anchor="middle">cs:241-242</text>
    <rect class="cont" x="1060" y="450.5" width="230" height="57" rx="6"/>
    <text class="ex-t" x="1175" y="466.5" text-anchor="middle">continues elsewhere</text>
    <text class="ex-b" x="1175" y="479" text-anchor="middle">critical-paths/01-hello.svg</text>
    <text class="ex-r" x="1175" y="491.5" text-anchor="middle">cs:245-250</text>
  
    <line class="edge" x1="850" y1="186" x2="850" y2="206" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="850" y1="301" x2="850" y2="321" marker-end="url(#arrow-edge)"/>
    <line class="edge" x1="850" y1="403" x2="850" y2="423" marker-end="url(#arrow-edge)"/>
    <line class="edgeNo" x1="850" y1="518" x2="850" y2="538" marker-end="url(#arrow-edgeNo)"/>
    <text class="lblNo" x="858" y="528">no (capacity full)</text>
    <polyline class="edgeCt" points="1020,470.5 1060,479" marker-end="url(#arrow-edgeCt)"/>
    <text class="lblCt" x="1040" y="464.5" text-anchor="middle">yes</text>
  
    <g font-family="Arial, Helvetica, sans-serif">
      <rect class="proc" x="40" y="666" width="16" height="12" rx="2"/><text class="legend-r" x="60" y="676">step</text>
      <polygon class="dec" points="150,666 158,672 150,678 142,672"/><text class="legend-r" x="164" y="676">decision</text>
      <rect class="endexc" x="240" y="666" width="16" height="12" rx="6"/><text class="legend-r" x="260" y="676">exceptional exit</text>
      <rect class="cont" x="480" y="666" width="16" height="12" rx="3"/><text class="legend-r" x="500" y="676">success — continues in another diagram</text>
    </g>
</svg>
